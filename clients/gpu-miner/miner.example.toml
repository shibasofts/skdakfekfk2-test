# Copy to miner.toml (gitignored). Or use env vars (EQM_*).

[network]
# Default: equium.xyz's server-side RPC proxy. Forwards to their paid Helius
# at 120 req/min per IP. For a fleet of miners on the same IP, switch to your
# own Helius / Triton URL below.
rpc_url = "https://equium.xyz/api/rpc"
# Fallback list, rotated on rate-limit/error.
rpc_fallbacks = ["https://api.mainnet-beta.solana.com"]
# Program ID (mainnet default).
program_id = "ZKGMUfxiRCXFPnqz9zgqAnuqJy15jk7fKbR4o6FuEQM"

[wallet]
# Path to a Solana keypair JSON (same format as `solana-keygen new`).
# NEVER put the secret directly in this file. Use the env var or this file path.
keypair_path = "wallet.json"

[gpu]
# "all" = every OpenCL device, or a list of flat indices like [0, 1]
devices = "all"
# Number of WORK-GROUPS launched per kernel call. Each WG = one nonce (256 WIs
# cooperate on it). Workspace ≈ 38 MB per WG. 16 GB card → ≤430 WGs, 32 GB → ≤870.
batch_size = 128
# WIs per work-group (must match the kernel's reqd_work_group_size and BUCKETS%lsz=0).
# 256 is a good default; try 128/512 if the compiler prefers.
local_size = 256

[behaviour]
# Don't broadcast tx (build/sign/verify only). Useful for first-run sanity.
dry_run = false
# Verify every GPU hit on CPU before submitting. Strongly recommended.
verify_on_cpu = true
# DEBUG | INFO | WARNING | ERROR
log_level = "INFO"
# Max attempts per round before refetching state (per device).
max_nonces_per_round = 65536

[compute]
# Compute-unit limit set on the mine tx. Plan default 1.4M, can lower once profiled.
cu_limit = 1_400_000
# Optional micro-lamports per CU prio fee (helps win races vs CPU miners).
priority_micro_lamports = 0

[empty_round]
# Auto-fire advance_empty_round if chain hasn't moved in this many seconds.
stall_secs = 75
# Back off this many seconds between attempts so racing miners don't all spam fees.
cooldown_secs = 30
