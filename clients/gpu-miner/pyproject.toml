[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equium-gpu-miner"
version = "0.1.0"
description = "OpenCL GPU miner for Equium ($EQM) on Solana"
requires-python = ">=3.11"
dependencies = [
    "pyopencl>=2024.1",
    "numpy>=1.26",
    "solana>=0.34",
    "solders>=0.21",
    "tomli>=2.0; python_version < '3.11'",
    "python-dotenv>=1.0",
    "click>=8.1",
    "base58>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
equium-gpu-miner = "equiumminer.cli:main"

[tool.setuptools.packages.find]
include = ["equiumminer*"]

[tool.setuptools.package-data]
equiumminer = ["kernels/*.cl"]
